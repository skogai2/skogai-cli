[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skogai-cli"
version = "0.1.0"
description = "The skogai command: one place for skogai conventions, starting with environment variables and directories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
skogai = "skogai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
